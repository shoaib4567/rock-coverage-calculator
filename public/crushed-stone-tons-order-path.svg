<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="title desc">
  <title id="title">Crushed stone tons order path</title>
  <desc id="desc">A 360 square foot layer at 3 inches is 3.33 cubic yards. At a sample loose bulk weight of 1.35 short tons per cubic yard, it is 4.50 tons. An optional 10 percent extra produces a 4.95 short ton order estimate.</desc>
  <defs>
    <linearGradient id="back" x2="1" y2="1"><stop stop-color="#17232a"/><stop offset="1" stop-color="#22333a"/></linearGradient>
    <pattern id="grain" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="3" cy="5" r="2" fill="#96a7a8" opacity=".13"/><circle cx="17" cy="16" r="3" fill="#96a7a8" opacity=".12"/></pattern>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#e6b46a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></marker>
  </defs>
  <rect width="900" height="520" rx="22" fill="url(#back)"/>
  <rect width="900" height="520" rx="22" fill="url(#grain)"/>
  <text x="48" y="60" fill="#e6b46a" font-family="Arial,sans-serif" font-size="20" font-weight="700" letter-spacing="3">MEASURE → CONVERT → ORDER</text>
  <text x="48" y="108" fill="#f3f0e8" font-family="Arial,sans-serif" font-size="33" font-weight="700">A tonnage estimate in three decisions</text>
  <g font-family="Arial,sans-serif">
    <rect x="46" y="156" width="242" height="236" rx="16" fill="#293c44" stroke="#557078"/>
    <circle cx="77" cy="188" r="17" fill="#e6b46a"/><text x="72" y="195" fill="#17232a" font-size="18" font-weight="700">1</text>
    <text x="105" y="195" fill="#e6b46a" font-size="17" font-weight="700">FINISHED LAYER</text>
    <text x="68" y="249" fill="#f3f0e8" font-size="22">360 sq ft × 3 in</text>
    <text x="68" y="283" fill="#a9bec1" font-size="17">÷ 324</text>
    <text x="68" y="355" fill="#fff" font-size="34" font-weight="700">3.33 yd³</text>
    <path d="M296 274h28" stroke="#e6b46a" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="330" y="156" width="242" height="236" rx="16" fill="#293c44" stroke="#557078"/>
    <circle cx="361" cy="188" r="17" fill="#e6b46a"/><text x="356" y="195" fill="#17232a" font-size="18" font-weight="700">2</text>
    <text x="389" y="195" fill="#e6b46a" font-size="17" font-weight="700">LOOSE WEIGHT</text>
    <text x="352" y="249" fill="#f3f0e8" font-size="22">3.33 yd³ × 1.35</text>
    <text x="352" y="283" fill="#a9bec1" font-size="17">short tons per yd³</text>
    <text x="352" y="355" fill="#fff" font-size="34" font-weight="700">4.50 tons</text>
    <path d="M580 274h28" stroke="#e6b46a" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="614" y="156" width="242" height="236" rx="16" fill="#385046" stroke="#83a180"/>
    <circle cx="645" cy="188" r="17" fill="#e6b46a"/><text x="640" y="195" fill="#17232a" font-size="18" font-weight="700">3</text>
    <text x="673" y="195" fill="#e6b46a" font-size="17" font-weight="700">OPTIONAL EXTRA</text>
    <text x="636" y="249" fill="#f3f0e8" font-size="22">4.50 tons × 1.10</text>
    <text x="636" y="283" fill="#c2d4c4" font-size="17">10% added to order</text>
    <text x="636" y="355" fill="#fff" font-size="34" font-weight="700">4.95 tons</text>
    <text x="48" y="448" fill="#d1dbd9" font-size="18">Planning example: #57 stone at 1.35 US short tons/yd³</text>
    <text x="48" y="478" fill="#a9bec1" font-size="16">Replace sample bulk weight and extra with your supplier’s figures.</text>
  </g>
</svg>
