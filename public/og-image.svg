<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="30%" r="80%" fx="50%" fy="30%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#090d14"/>
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>

  <!-- Subtle Grid Pattern -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="100" x2="1200" y2="100"/>
    <line x1="0" y1="200" x2="1200" y2="200"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="0" y1="400" x2="1200" y2="400"/>
    <line x1="0" y1="500" x2="1200" y2="500"/>
    <line x1="200" y1="0" x2="200" y2="630"/>
    <line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="800" y1="0" x2="800" y2="630"/>
    <line x1="1000" y1="0" x2="1000" y2="630"/>
  </g>

  <!-- Top Accent Bar -->
  <rect x="0" y="0" width="1200" height="6" fill="url(#goldGrad)"/>

  <!-- Logo Icon -->
  <g transform="translate(100, 90)">
    <rect width="64" height="64" rx="16" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5"/>
    <path d="M32 16L18 24.5V40L32 48L46 40V24.5L32 16Z" fill="none" stroke="url(#goldGrad)" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M32 16V28" stroke="url(#goldGrad)" stroke-width="2.5" opacity="0.7"/>
    <path d="M32 28L46 24.5" stroke="url(#goldGrad)" stroke-width="2.5" opacity="0.7"/>
    <path d="M32 28L18 24.5" stroke="url(#goldGrad)" stroke-width="2.5" opacity="0.7"/>
  </g>

  <!-- Site Title & Badge -->
  <text x="180" y="132" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="700" fill="#ffffff" letter-spacing="-0.5">
    Rock Coverage <tspan fill="#eab308">Calculator</tspan>
  </text>
  
  <rect x="940" y="102" width="160" height="38" rx="19" fill="#eab308" fill-opacity="0.12" stroke="#eab308" stroke-width="1"/>
  <text x="1020" y="126" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#eab308" text-anchor="middle" letter-spacing="0.5">ASTM C29 CERTIFIED</text>

  <!-- Main Headline -->
  <text x="100" y="250" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="52" font-weight="800" fill="#ffffff" letter-spacing="-1">
    Quarry-Calibrated Aggregate
  </text>
  <text x="100" y="315" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="52" font-weight="800" fill="url(#goldGrad)" letter-spacing="-1">
    Coverage &amp; Volume Estimator
  </text>

  <!-- Subtitle -->
  <text x="100" y="380" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="400" fill="#94a3b8">
    Calculate exact cubic yards, tons, and bags for 12 quarry aggregates across 6 area shapes.
  </text>

  <!-- 3 Stats Cards -->
  <g transform="translate(100, 440)">
    <!-- Card 1 -->
    <rect x="0" y="0" width="310" height="110" rx="14" fill="url(#cardGrad)" stroke="#334155" stroke-width="1"/>
    <text x="28" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="700" fill="#ffffff">12 Materials</text>
    <text x="28" y="80" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="500" fill="#94a3b8">Pea Gravel to Crushed Stone</text>

    <!-- Card 2 -->
    <rect x="340" y="0" width="310" height="110" rx="14" fill="url(#cardGrad)" stroke="#334155" stroke-width="1"/>
    <text x="368" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="700" fill="#ffffff">Dual Units</text>
    <text x="368" y="80" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="500" fill="#94a3b8">Yards, Tons, Bags &amp; Metric</text>

    <!-- Card 3 -->
    <rect x="680" y="0" width="320" height="110" rx="14" fill="url(#cardGrad)" stroke="#334155" stroke-width="1"/>
    <text x="708" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="700" fill="#ffffff">3D Visualizer</text>
    <text x="708" y="80" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="500" fill="#94a3b8">Interactive Real-Time Simulation</text>
  </g>
</svg>
