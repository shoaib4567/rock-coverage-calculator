<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 410" role="img" aria-labelledby="title desc">
  <title id="title">Drain-rock trench takeoff cross-section</title>
  <desc id="desc">A 12-inch-wide trench has 4 inches of top cover, 14 inches of gravel fill, fabric separating gravel from soil, and a 4-inch pipe displacing gravel.</desc>
  <defs>
    <pattern id="soil" width="18" height="18" patternUnits="userSpaceOnUse">
      <rect width="18" height="18" fill="#342b2b"/>
      <path d="M2 4h4m8 5h3M5 14h5" stroke="#554238" stroke-width="2" stroke-linecap="round"/>
    </pattern>
    <pattern id="stone" width="54" height="47" patternUnits="userSpaceOnUse">
      <rect width="54" height="47" fill="#514f4d"/>
      <ellipse cx="14" cy="13" rx="11" ry="8" fill="#aaa497" stroke="#d0c6ad" stroke-width="2"/>
      <ellipse cx="40" cy="11" rx="9" ry="7" fill="#7e837d" stroke="#b4bdb4" stroke-width="2"/>
      <ellipse cx="27" cy="35" rx="13" ry="8" fill="#8f897d" stroke="#c9c1ad" stroke-width="2"/>
      <circle cx="5" cy="36" r="3" fill="#a8a394"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10Z" fill="#e5bc6b"/>
    </marker>
  </defs>
  <rect width="720" height="410" rx="18" fill="#181e24"/>
  <text x="32" y="38" fill="#f3f0e8" font-size="22" font-family="Arial, sans-serif" font-weight="700">Which part of the trench gets rock?</text>
  <rect x="35" y="78" width="650" height="284" rx="10" fill="url(#soil)"/>
  <path d="M35 82h650" stroke="#8c7560" stroke-width="5"/>
  <rect x="212" y="82" width="292" height="70" fill="#6e5745"/>
  <text x="358" y="126" text-anchor="middle" fill="#f9e1bd" font-size="22" font-family="Arial, sans-serif" font-weight="700">4 in top cover</text>
  <rect x="212" y="152" width="292" height="210" fill="url(#stone)"/>
  <path d="M212 152v210h292V152h-292" fill="none" stroke="#e7bc69" stroke-width="6" stroke-dasharray="11 5"/>
  <circle cx="358" cy="294" r="42" fill="#252c32" stroke="#d5dce0" stroke-width="11"/>
  <circle cx="358" cy="294" r="26" fill="#1b242c"/>
  <text x="358" y="301" text-anchor="middle" fill="#f7f9f8" font-size="18" font-family="Arial, sans-serif" font-weight="700">pipe</text>
  <path d="M212 385h292" stroke="#e5bc6b" stroke-width="3" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="358" y="403" text-anchor="middle" fill="#f0d194" font-size="19" font-family="Arial, sans-serif" font-weight="700">12 in trench width</text>
  <path d="M533 156v202" stroke="#e5bc6b" stroke-width="3" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="546" y="234" fill="#f0d194" font-size="21" font-family="Arial, sans-serif" font-weight="700">14 in</text>
  <text x="546" y="260" fill="#f0d194" font-size="18" font-family="Arial, sans-serif">rock fill</text>
  <path d="M127 237h88" stroke="#d8e9eb" stroke-width="3"/>
  <text x="47" y="227" fill="#e5f1ee" font-size="19" font-family="Arial, sans-serif" font-weight="700">fabric</text>
  <text x="47" y="252" fill="#d1ddda" font-size="17" font-family="Arial, sans-serif">separator</text>
  <path d="M462 293h75" stroke="#d8e9eb" stroke-width="3"/>
  <text x="545" y="298" fill="#e5f1ee" font-size="19" font-family="Arial, sans-serif">4 in OD pipe</text>
</svg>
