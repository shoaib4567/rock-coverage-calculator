<svg xmlns="http://www.w3.org/2000/svg" width="960" height="430" viewBox="0 0 960 430" role="img" aria-labelledby="title desc">
  <title id="title">Two-course gravel driveway cross section</title>
  <desc id="desc">A gently crowned surface course sits over a separate graded base and prepared subgrade. Arrows show surface water moving toward both sides. The layers are illustrative, not a required thickness.</desc>
  <defs>
    <pattern id="surface-stones" width="33" height="18" patternUnits="userSpaceOnUse">
      <path d="M4 11l5-3 5 3-3 4H5zM21 4l4-2 5 3-3 4h-5z" fill="#9a9ca0" stroke="#52545a" stroke-width="1"/>
    </pattern>
    <pattern id="base-stones" width="42" height="28" patternUnits="userSpaceOnUse">
      <path d="M4 10l8-5 9 3 1 8-10 3-7-3zM25 19l7-5 7 3-1 7-7 2z" fill="#b89f78" stroke="#725c43" stroke-width="1.2"/>
    </pattern>
    <pattern id="soil" width="42" height="24" patternUnits="userSpaceOnUse">
      <path d="M5 11h3m13 7h4m12-12h3" stroke="#ad7a48" stroke-width="2" stroke-linecap="round"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0l10 5-10 5z" fill="#2681a6"/>
    </marker>
  </defs>
  <rect width="960" height="430" rx="22" fill="#f6f7f5"/>
  <text x="42" y="49" fill="#243c47" font-family="Arial, sans-serif" font-size="25" font-weight="700">Measure each driveway course separately</text>
  <text x="42" y="76" fill="#53636a" font-family="Arial, sans-serif" font-size="15">Finished depth is the installed layer; the order estimate adds only the allowances you enter.</text>
  <path d="M70 218 Q480 160 890 218 L890 254 Q480 196 70 254Z" fill="#c9cbca" stroke="#555c60" stroke-width="3"/>
  <path d="M70 218 Q480 160 890 218 L890 254 Q480 196 70 254Z" fill="url(#surface-stones)" opacity=".7"/>
  <path d="M70 254 Q480 196 890 254 L890 335 Q480 277 70 335Z" fill="#d4c2a6" stroke="#7d6548" stroke-width="3"/>
  <path d="M70 254 Q480 196 890 254 L890 335 Q480 277 70 335Z" fill="url(#base-stones)" opacity=".7"/>
  <path d="M70 335 Q480 277 890 335 L890 387 H70Z" fill="#ead8be" stroke="#ad7a48" stroke-width="3"/>
  <path d="M70 335 Q480 277 890 335 L890 387 H70Z" fill="url(#soil)"/>
  <path d="M455 119 Q335 135 182 176" fill="none" stroke="#2681a6" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M505 119 Q625 135 778 176" fill="none" stroke="#2681a6" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="480" y="112" text-anchor="middle" fill="#2681a6" font-family="Arial, sans-serif" font-size="16" font-weight="700">crown directs runoff to both sides</text>
  <rect x="94" y="218" width="206" height="30" rx="6" fill="#243c47" opacity=".96"/>
  <text x="106" y="239" fill="#ffffff" font-family="Arial, sans-serif" font-size="15" font-weight="700">SURFACE COURSE</text>
  <rect x="344" y="273" width="182" height="30" rx="6" fill="#59452e" opacity=".96"/>
  <text x="358" y="294" fill="#ffffff" font-family="Arial, sans-serif" font-size="15" font-weight="700">GRADED BASE</text>
  <rect x="577" y="349" width="213" height="29" rx="6" fill="#895b31" opacity=".95"/>
  <text x="591" y="369" fill="#ffffff" font-family="Arial, sans-serif" font-size="14" font-weight="700">PREPARED SUBGRADE</text>
  <text x="480" y="412" text-anchor="middle" fill="#53636a" font-family="Arial, sans-serif" font-size="14">Example profile only — thickness, aggregate and drainage depend on soil and traffic.</text>
</svg>
