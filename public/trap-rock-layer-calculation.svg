<svg xmlns="http://www.w3.org/2000/svg" width="760" height="500" viewBox="0 0 760 500" role="img" aria-labelledby="title desc">
  <title id="title">Trap rock layer to cubic yards and tons</title>
  <desc id="desc">A 20 by 5 foot area at a finished depth of 3 inches contains 25 cubic feet, or 0.93 cubic yard. At an example loose weight of 2,600 pounds per cubic yard the layer weighs about 1.20 US short tons.</desc>
  <defs>
    <pattern id="stone" width="44" height="30" patternUnits="userSpaceOnUse">
      <path d="M2 13 13 4 27 7 34 18 21 26 7 24Z" fill="#687b82" stroke="#a8bac0" stroke-width="1.3"/>
      <path d="M31 3 43 6 42 23 35 22 28 13Z" fill="#455760" stroke="#8fa7af" stroke-width="1"/>
    </pattern>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0 0 9 4.5 0 9Z" fill="#e7ba73"/>
    </marker>
  </defs>
  <rect width="760" height="500" rx="18" fill="#182830"/>
  <rect x="16" y="16" width="728" height="468" rx="13" fill="#21343d" stroke="#5a7279"/>
  <text x="34" y="49" font-family="Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="2" fill="#e7ba73">TRAP ROCK QUANTITY</text>
  <text x="34" y="81" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#f0f5f5">Measure the layer. Convert with the supplier.</text>

  <rect x="34" y="111" width="692" height="183" rx="12" fill="#182830" stroke="#5a7279"/>
  <text x="52" y="139" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#d9e6e7">01  AREA + FINISHED DEPTH</text>
  <path d="M93 183 300 183 361 216 154 216Z" fill="url(#stone)" stroke="#d9e6e7" stroke-width="2"/>
  <path d="M154 216 361 216 361 246 154 246Z" fill="#40535b" stroke="#d9e6e7" stroke-width="2"/>
  <path d="M93 183 154 216 154 246 93 213Z" fill="#52666e" stroke="#d9e6e7" stroke-width="2"/>
  <path d="M106 168h190" stroke="#e7ba73" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="172" y="162" font-family="Arial, sans-serif" font-size="13" fill="#ffe2ad">20 ft</text>
  <path d="M75 188v30" stroke="#e7ba73" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="43" y="238" font-family="Arial, sans-serif" font-size="13" fill="#ffe2ad">5 ft</text>
  <path d="M380 217v28" stroke="#e7ba73" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="391" y="238" font-family="Arial, sans-serif" font-size="13" fill="#ffe2ad">3 in</text>
  <text x="488" y="190" font-family="Arial, sans-serif" font-size="29" font-weight="700" fill="#fff">100 sq ft</text>
  <text x="488" y="218" font-family="Arial, sans-serif" font-size="14" fill="#b8c9cd">20 ft × 5 ft</text>
  <text x="488" y="258" font-family="Arial, sans-serif" font-size="14" fill="#b8c9cd">Finished layer: 3 in</text>

  <path d="M150 310h460" stroke="#e7ba73" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="34" y="334" width="215" height="120" rx="10" fill="#2d424a" stroke="#799098"/>
  <text x="50" y="360" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#e7ba73">02  VOLUME</text>
  <text x="50" y="394" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#f3f7f7">25 cu ft</text>
  <text x="50" y="426" font-family="Arial, sans-serif" font-size="15" fill="#c2d1d3">= 0.93 cu yd</text>
  <rect x="273" y="334" width="215" height="120" rx="10" fill="#2d424a" stroke="#799098"/>
  <text x="289" y="360" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#e7ba73">03  SUPPLIER WEIGHT</text>
  <text x="289" y="394" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#f3f7f7">2,600 lb</text>
  <text x="289" y="426" font-family="Arial, sans-serif" font-size="15" fill="#c2d1d3">per loose cu yd</text>
  <rect x="512" y="334" width="214" height="120" rx="10" fill="#63513e" stroke="#e7ba73"/>
  <text x="528" y="360" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#ffe0a3">04  ESTIMATED ORDER</text>
  <text x="528" y="394" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#fff">1.20 tons</text>
  <text x="528" y="426" font-family="Arial, sans-serif" font-size="15" fill="#f3ddbb">US short tons</text>
</svg>
