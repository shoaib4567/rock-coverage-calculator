<svg xmlns="http://www.w3.org/2000/svg" width="840" height="560" viewBox="0 0 840 560" role="img" aria-labelledby="title desc">
  <title id="title">Gravel area to bulk yard order</title>
  <desc id="desc">A 40 by 12 foot area at three inches finished depth needs 4.44 cubic yards in place. Add ten percent to plan for 4.89 cubic yards, then round up to five cubic yards when the seller uses half-yard increments.</desc>
  <defs>
    <pattern id="gravel" width="42" height="34" patternUnits="userSpaceOnUse">
      <ellipse cx="9" cy="9" rx="7" ry="5" fill="#87948d"/>
      <ellipse cx="29" cy="8" rx="9" ry="6" fill="#b8ad96"/>
      <ellipse cx="22" cy="27" rx="8" ry="5" fill="#667d76"/>
      <ellipse cx="42" cy="28" rx="7" ry="5" fill="#a29e8f"/>
    </pattern>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M1 1 L7 4.5 L1 8" fill="none" stroke="#416a5c" stroke-width="2"/>
    </marker>
  </defs>
  <rect width="840" height="560" rx="22" fill="#f8f5ec"/>
  <text x="36" y="52" fill="#203b33" font-family="Arial, sans-serif" font-size="25" font-weight="700">From finished depth to a bulk order</text>
  <text x="36" y="79" fill="#53675e" font-family="Arial, sans-serif" font-size="15">Keep the measured volume, extra material, and seller rounding separate.</text>

  <rect x="32" y="108" width="335" height="387" rx="17" fill="#e8e4d9" stroke="#d4d0c6"/>
  <text x="53" y="141" fill="#203b33" font-family="Arial, sans-serif" font-size="17" font-weight="700">1  Measure the finished layer</text>
  <rect x="85" y="182" width="228" height="142" rx="5" fill="url(#gravel)" stroke="#60766c" stroke-width="3"/>
  <path d="M85 340 H313" stroke="#416a5c" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="178" y="365" fill="#203b33" font-family="Arial, sans-serif" font-size="16" font-weight="700">40 ft</text>
  <path d="M67 182 V324" stroke="#416a5c" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="56" y="265" transform="rotate(-90 56 265)" fill="#203b33" font-family="Arial, sans-serif" font-size="16" font-weight="700">12 ft</text>
  <rect x="74" y="395" width="251" height="56" rx="9" fill="#d6cbb5" stroke="#a59477"/>
  <rect x="74" y="395" width="251" height="18" rx="3" fill="url(#gravel)"/>
  <path d="M337 395 V413" stroke="#416a5c" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="272" y="478" fill="#203b33" font-family="Arial, sans-serif" font-size="15" font-weight="700">3 in deep</text>
  <text x="83" y="478" fill="#53675e" font-family="Arial, sans-serif" font-size="13">480 sq ft footprint</text>

  <path d="M382 300 H413" stroke="#416a5c" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="425" y="108" width="383" height="108" rx="15" fill="#e2ece7" stroke="#adc6b8"/>
  <text x="445" y="140" fill="#416a5c" font-family="Arial, sans-serif" font-size="15" font-weight="700">2  FINISHED VOLUME</text>
  <text x="445" y="178" fill="#203b33" font-family="Arial, sans-serif" font-size="29" font-weight="700">4.44 yd³</text>
  <text x="595" y="176" fill="#53675e" font-family="Arial, sans-serif" font-size="14">480 × 3 ÷ 324</text>

  <path d="M615 219 V236" stroke="#416a5c" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="425" y="244" width="383" height="108" rx="15" fill="#e8ece9" stroke="#bacbc0"/>
  <text x="445" y="276" fill="#416a5c" font-family="Arial, sans-serif" font-size="15" font-weight="700">3  WITH 10% EXTRA</text>
  <text x="445" y="314" fill="#203b33" font-family="Arial, sans-serif" font-size="29" font-weight="700">4.89 yd³</text>
  <text x="595" y="312" fill="#53675e" font-family="Arial, sans-serif" font-size="14">4.44… × 1.10</text>

  <path d="M615 355 V372" stroke="#416a5c" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="425" y="380" width="383" height="108" rx="15" fill="#d1e2d7" stroke="#91b4a0"/>
  <text x="445" y="412" fill="#315a48" font-family="Arial, sans-serif" font-size="15" font-weight="700">4  HALF-YARD SALES INCREMENT</text>
  <text x="445" y="452" fill="#203b33" font-family="Arial, sans-serif" font-size="32" font-weight="700">Order 5.00 yd³</text>
  <text x="32" y="534" fill="#53675e" font-family="Arial, sans-serif" font-size="14">Example only: use your seller’s actual unit, minimum, and loose-to-finished yield.</text>
</svg>
