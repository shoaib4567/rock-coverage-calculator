<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 520" role="img" aria-labelledby="title desc">
  <title id="title">One cubic yard of river rock at three installed depths</title>
  <desc id="desc">A constant volume makes a wide shallow layer or a smaller deep layer: 162 square feet at 2 inches, 108 square feet at 3 inches, and 81 square feet at 4 inches.</desc>
  <defs>
    <pattern id="pebbles" width="58" height="38" patternUnits="userSpaceOnUse">
      <rect width="58" height="38" fill="#d7e5de"/>
      <ellipse cx="11" cy="8" rx="11" ry="7" fill="#89ab9d" stroke="#436c5c" stroke-width="1.5"/>
      <ellipse cx="40" cy="13" rx="15" ry="9" fill="#b4c8b4" stroke="#436c5c" stroke-width="1.5"/>
      <ellipse cx="16" cy="33" rx="15" ry="8" fill="#c4aa83" stroke="#735f44" stroke-width="1.5"/>
      <ellipse cx="49" cy="33" rx="12" ry="8" fill="#89ab9d" stroke="#436c5c" stroke-width="1.5"/>
    </pattern>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#315f4c"/>
    </marker>
  </defs>
  <rect width="820" height="520" rx="24" fill="#f4f7f2"/>
  <text x="44" y="49" fill="#193d32" font-family="Arial, sans-serif" font-size="25" font-weight="700">One cubic yard, three finished depths</text>
  <text x="44" y="76" fill="#486457" font-family="Arial, sans-serif" font-size="15">The same loose stone volume covers less ground when spread deeper.</text>

  <text x="44" y="116" fill="#193d32" font-family="Arial, sans-serif" font-size="16" font-weight="700">2 in</text>
  <rect x="44" y="132" width="540" height="36" rx="5" fill="url(#pebbles)" stroke="#315f4c" stroke-width="2"/>
  <line x1="44" y1="176" x2="584" y2="176" stroke="#886e52" stroke-width="3"/>
  <line x1="52" y1="191" x2="576" y2="191" stroke="#315f4c" stroke-width="1.5" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <rect x="611" y="129" width="166" height="50" rx="12" fill="#dcebe1"/>
  <text x="694" y="161" text-anchor="middle" fill="#193d32" font-family="Arial, sans-serif" font-size="21" font-weight="700">162 sq ft</text>

  <text x="44" y="232" fill="#193d32" font-family="Arial, sans-serif" font-size="16" font-weight="700">3 in</text>
  <rect x="44" y="248" width="360" height="54" rx="5" fill="url(#pebbles)" stroke="#315f4c" stroke-width="2"/>
  <line x1="44" y1="310" x2="404" y2="310" stroke="#886e52" stroke-width="3"/>
  <line x1="52" y1="325" x2="396" y2="325" stroke="#315f4c" stroke-width="1.5" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <rect x="611" y="253" width="166" height="50" rx="12" fill="#dcebe1"/>
  <text x="694" y="285" text-anchor="middle" fill="#193d32" font-family="Arial, sans-serif" font-size="21" font-weight="700">108 sq ft</text>

  <text x="44" y="364" fill="#193d32" font-family="Arial, sans-serif" font-size="16" font-weight="700">4 in</text>
  <rect x="44" y="380" width="270" height="72" rx="5" fill="url(#pebbles)" stroke="#315f4c" stroke-width="2"/>
  <line x1="44" y1="460" x2="314" y2="460" stroke="#886e52" stroke-width="3"/>
  <line x1="52" y1="475" x2="306" y2="475" stroke="#315f4c" stroke-width="1.5" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <rect x="611" y="393" width="166" height="50" rx="12" fill="#dcebe1"/>
  <text x="694" y="425" text-anchor="middle" fill="#193d32" font-family="Arial, sans-serif" font-size="21" font-weight="700">81 sq ft</text>
  <text x="44" y="506" fill="#486457" font-family="Arial, sans-serif" font-size="12">Area is based on volume and average depth; illustration is schematic.</text>
</svg>
