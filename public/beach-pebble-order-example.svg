<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420" role="img" aria-labelledby="title desc">
<title id="title">Beach pebble border order example</title>
<desc id="desc">A 20 foot by 4 foot border at 3 inches deep contains 20 cubic feet of pebbles. With 10 percent ordering allowance, plan 22 cubic feet, or 88 quarter-cubic-foot bags or 44 half-cubic-foot bags.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#102833"/><stop offset="1" stop-color="#18202d"/></linearGradient>
  <linearGradient id="stone" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#a2aeb0"/><stop offset="1" stop-color="#566976"/></linearGradient>
</defs>
<rect width="960" height="420" rx="24" fill="url(#bg)"/>
<text x="42" y="49" fill="#85d9cf" font-family="Arial, sans-serif" font-size="15" font-weight="700" letter-spacing="2">BEACH PEBBLE ORDER EXAMPLE</text>
<text x="42" y="88" fill="#fff" font-family="Arial, sans-serif" font-size="27" font-weight="700">Measure the finished layer first</text>
<text x="42" y="116" fill="#c6d5d8" font-family="Arial, sans-serif" font-size="16">20 ft × 4 ft = 80 sq ft of contained bed</text>
<rect x="40" y="150" width="450" height="224" rx="17" fill="#223e45" stroke="#4c6b70" stroke-width="2"/>
<text x="63" y="181" fill="#d7eeee" font-family="Arial, sans-serif" font-size="18" font-weight="700">3 in finished pebble layer</text>
<rect x="67" y="285" width="392" height="56" rx="4" fill="#654c3e"/>
<rect x="67" y="274" width="392" height="8" rx="4" fill="#59a8a1"/>
<ellipse cx="88" cy="262" rx="20" ry="13" fill="url(#stone)" stroke="#bccacc" stroke-width="2"/>
<ellipse cx="126" cy="246" rx="26" ry="16" fill="#687b82" stroke="#b4c5c5" stroke-width="2"/>
<ellipse cx="165" cy="260" rx="22" ry="14" fill="#90a2a4" stroke="#c4d3d3" stroke-width="2"/>
<ellipse cx="206" cy="244" rx="26" ry="17" fill="#536d78" stroke="#abc1c1" stroke-width="2"/>
<ellipse cx="249" cy="259" rx="27" ry="14" fill="#84979c" stroke="#becfcf" stroke-width="2"/>
<ellipse cx="295" cy="245" rx="28" ry="18" fill="#62777f" stroke="#b5c6c6" stroke-width="2"/>
<ellipse cx="341" cy="259" rx="27" ry="14" fill="#9aa9a8" stroke="#c8d6d3" stroke-width="2"/>
<ellipse cx="389" cy="244" rx="30" ry="18" fill="#5a6e76" stroke="#bac8c8" stroke-width="2"/>
<ellipse cx="435" cy="261" rx="24" ry="13" fill="#82949a" stroke="#bfcecd" stroke-width="2"/>
<path d="M478 227v48m-8-48h16m-16 48h16" stroke="#efc77c" stroke-width="3"/>
<text x="68" y="363" fill="#c3d7d7" font-family="Arial, sans-serif" font-size="14">Separator and ground shown for context · not to scale</text>
<path d="M511 263h38m-10-10 10 10-10 10" fill="none" stroke="#85d9cf" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="568" y="148" width="351" height="227" rx="17" fill="#233948" stroke="#4b6f78" stroke-width="2"/>
<text x="591" y="182" fill="#e4f5f4" font-family="Arial, sans-serif" font-size="17" font-weight="700">Installed</text>
<text x="591" y="220" fill="#ffffff" font-family="Arial, sans-serif" font-size="32" font-weight="700">20 cu ft</text>
<text x="770" y="217" fill="#adc6cb" font-family="Arial, sans-serif" font-size="15">0.74 cu yd</text>
<path d="M591 235h305" stroke="#55717a" stroke-width="2"/>
<text x="591" y="262" fill="#e4f5f4" font-family="Arial, sans-serif" font-size="16" font-weight="700">Order with 10% extra</text>
<text x="591" y="298" fill="#efc77c" font-family="Arial, sans-serif" font-size="30" font-weight="700">22 cu ft</text>
<text x="768" y="296" fill="#adc6cb" font-family="Arial, sans-serif" font-size="15">0.81 cu yd</text>
<text x="591" y="330" fill="#d2e4e6" font-family="Arial, sans-serif" font-size="16">88 bags × 0.25 cu ft</text>
<text x="591" y="353" fill="#d2e4e6" font-family="Arial, sans-serif" font-size="16">44 bags × 0.5 cu ft</text>
</svg>