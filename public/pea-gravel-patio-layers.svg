<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 430" role="img" aria-labelledby="title desc">
  <title id="title">Pea gravel patio layer section</title>
  <desc id="desc">An illustrative 2-inch pea gravel surface sits over a 4-inch compacted angular aggregate base. Optional geotextile separates the base from prepared soil, and edging retains both sides.</desc>
  <defs>
    <pattern id="pea" width="32" height="28" patternUnits="userSpaceOnUse">
      <circle cx="8" cy="9" r="5" fill="#d9b98b" stroke="#806342" stroke-width="1.5"/>
      <circle cx="24" cy="19" r="6" fill="#b99969" stroke="#806342" stroke-width="1.5"/>
      <circle cx="31" cy="2" r="4" fill="#e8cda4" stroke="#806342" stroke-width="1.5"/>
    </pattern>
    <pattern id="angular" width="56" height="48" patternUnits="userSpaceOnUse">
      <path d="M1 4 17 1 20 16 8 21ZM28 2 53 5 49 23 30 18ZM6 30 27 25 20 44 3 45ZM31 28 55 27 53 46 30 42Z" fill="#8d99a0" stroke="#4d606b" stroke-width="1.5"/>
    </pattern>
    <pattern id="soil" width="42" height="25" patternUnits="userSpaceOnUse">
      <path d="M2 7h16M24 19h16M5 22h8" stroke="#a38b71" stroke-width="2"/>
    </pattern>
  </defs>
  <rect width="980" height="430" rx="22" fill="#14212b"/>
  <text x="45" y="48" fill="#f4ead8" font-family="Arial, sans-serif" font-size="22" font-weight="700">A patio is two separate stone orders</text>
  <text x="45" y="72" fill="#c6d2d8" font-family="Arial, sans-serif" font-size="14">Default planning example • not a site specification</text>

  <rect x="80" y="112" width="620" height="60" fill="#c9a779"/>
  <rect x="80" y="112" width="620" height="60" fill="url(#pea)"/>
  <rect x="80" y="172" width="620" height="120" fill="#71808a"/>
  <rect x="80" y="172" width="620" height="120" fill="url(#angular)"/>
  <rect x="80" y="292" width="620" height="8" fill="#e1ba65"/>
  <rect x="80" y="300" width="620" height="70" fill="#675b4d"/>
  <rect x="80" y="300" width="620" height="70" fill="url(#soil)"/>
  <rect x="58" y="108" width="22" height="262" rx="3" fill="#b8c0c3" stroke="#e6ece9" stroke-width="2"/>
  <rect x="700" y="108" width="22" height="262" rx="3" fill="#b8c0c3" stroke="#e6ece9" stroke-width="2"/>

  <text x="98" y="150" fill="#352a22" font-family="Arial, sans-serif" font-size="19" font-weight="700">Washed, rounded pea gravel</text>
  <text x="98" y="225" fill="#fff" font-family="Arial, sans-serif" font-size="19" font-weight="700">Compacted angular crushed stone</text>
  <text x="98" y="251" fill="#f0f4f5" font-family="Arial, sans-serif" font-size="14">Depth is measured after compaction</text>
  <text x="98" y="338" fill="#f5ece0" font-family="Arial, sans-serif" font-size="17" font-weight="700">Prepared soil / subgrade</text>

  <path d="M756 112h18m-9 0v60m-9 0h18M756 172h18m-9 0v120m-9 0h18" stroke="#e7c887" stroke-width="2"/>
  <text x="787" y="146" fill="#f4ead8" font-family="Arial, sans-serif" font-size="17" font-weight="700">2 in loose top</text>
  <text x="787" y="230" fill="#f4ead8" font-family="Arial, sans-serif" font-size="17" font-weight="700">4 in finished base</text>
  <text x="742" y="296" fill="#e7c887" font-family="Arial, sans-serif" font-size="13">Optional fabric at soil</text>
  <text x="742" y="313" fill="#e7c887" font-family="Arial, sans-serif" font-size="13">when separation is needed</text>
  <text x="742" y="361" fill="#c6d2d8" font-family="Arial, sans-serif" font-size="13">Rigid edge retains stones</text>
  <text x="45" y="405" fill="#b5c2c9" font-family="Arial, sans-serif" font-size="13">Thicknesses shown to the same vertical scale; soil and edging are illustrative.</text>
</svg>
