<svg xmlns="http://www.w3.org/2000/svg" width="960" height="380" viewBox="0 0 960 380" role="img" aria-labelledby="title desc">
  <title id="title">One cubic yard of pea gravel at two depths</title>
  <desc id="desc">The same cubic yard covers 162 square feet at two inches deep or 108 square feet at three inches deep. The two cross-section blocks have equal area, representing equal volume at the same path length.</desc>
  <defs>
    <pattern id="stones" width="42" height="34" patternUnits="userSpaceOnUse">
      <rect width="42" height="34" fill="#d6b98b"/>
      <ellipse cx="10" cy="10" rx="9" ry="6" fill="#efddbc" stroke="#8b704d" stroke-width="1"/>
      <ellipse cx="32" cy="8" rx="8" ry="6" fill="#ae8c62" stroke="#725b40" stroke-width="1"/>
      <ellipse cx="18" cy="27" rx="10" ry="5" fill="#c29c6e" stroke="#725b40" stroke-width="1"/>
      <ellipse cx="40" cy="27" rx="7" ry="5" fill="#ead2aa" stroke="#8b704d" stroke-width="1"/>
    </pattern>
    <marker id="arrow" markerWidth="7" markerHeight="7" refX="3.5" refY="3.5" orient="auto">
      <path d="M0 0 L7 3.5 L0 7" fill="none" stroke="#2d6154" stroke-width="1.4"/>
    </marker>
  </defs>
  <rect width="960" height="380" fill="#f5f2e9"/>
  <text x="48" y="50" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#193b33">Same stone. Different depth.</text>
  <text x="48" y="81" font-family="Arial, sans-serif" font-size="16" fill="#4c635a">One cubic yard = 27 cubic feet in both views</text>

  <text x="66" y="136" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#193b33">2-inch layer</text>
  <text x="66" y="162" font-family="Arial, sans-serif" font-size="18" fill="#2d6154">162 sq ft covered</text>
  <rect x="66" y="217" width="450" height="80" fill="url(#stones)" stroke="#725b40" stroke-width="2"/>
  <line x1="48" y1="217" x2="48" y2="297" stroke="#2d6154" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="24" y="262" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#2d6154" transform="rotate(-90 24 262)">2 in</text>

  <text x="606" y="136" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#193b33">3-inch layer</text>
  <text x="606" y="162" font-family="Arial, sans-serif" font-size="18" fill="#2d6154">108 sq ft covered</text>
  <rect x="606" y="177" width="300" height="120" fill="url(#stones)" stroke="#725b40" stroke-width="2"/>
  <line x1="588" y1="177" x2="588" y2="297" stroke="#2d6154" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="564" y="242" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#2d6154" transform="rotate(-90 564 242)">3 in</text>

  <line x1="66" y1="313" x2="516" y2="313" stroke="#2d6154" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <line x1="606" y1="313" x2="906" y2="313" stroke="#2d6154" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="480" y="350" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#4c635a">Schematic cross-sections at equal path length • width shows relative coverage, not particle size</text>
</svg>
