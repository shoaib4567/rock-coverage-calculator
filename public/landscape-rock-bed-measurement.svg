<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 390" role="img" aria-labelledby="title desc">
  <title id="title">How to measure a landscape rock bed</title>
  <desc id="desc">Top view shows a 40-foot length and an 8-foot average width making 320 square feet. Side view shows a 3-inch finished rock layer above soil. At that depth, the example needs 2.96 cubic yards before extra material.</desc>
  <defs>
    <pattern id="pebbles" width="49" height="36" patternUnits="userSpaceOnUse">
      <rect width="49" height="36" fill="#344155"/>
      <ellipse cx="10" cy="10" rx="8" ry="5" fill="#9ba4ad"/>
      <ellipse cx="34" cy="13" rx="10" ry="6" fill="#b5a995"/>
      <ellipse cx="20" cy="30" rx="11" ry="5" fill="#65778a"/>
      <ellipse cx="47" cy="30" rx="7" ry="4" fill="#c5c9c9"/>
    </pattern>
    <marker id="arrow" markerWidth="7" markerHeight="7" refX="3.5" refY="3.5" orient="auto-start-reverse">
      <path d="M1 1 6 3.5 1 6" fill="none" stroke="#66d9bd" stroke-width="1.4"/>
    </marker>
  </defs>
  <rect width="900" height="390" rx="18" fill="#101a29"/>
  <rect x="20" y="20" width="550" height="350" rx="15" fill="#192637" stroke="#33485a"/>
  <rect x="590" y="20" width="290" height="350" rx="15" fill="#192637" stroke="#33485a"/>
  <text x="43" y="52" fill="#e8f3f0" font-family="Arial, sans-serif" font-size="19" font-weight="700">1. Measure the bed from above</text>
  <text x="43" y="76" fill="#b9c8d2" font-family="Arial, sans-serif" font-size="13">Length × average width = area to cover</text>
  <rect x="86" y="114" width="425" height="136" rx="19" fill="url(#pebbles)" stroke="#66d9bd" stroke-width="3"/>
  <line x1="86" y1="279" x2="511" y2="279" stroke="#66d9bd" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="298" y="303" fill="#66d9bd" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700">40 ft length</text>
  <line x1="60" y1="114" x2="60" y2="250" stroke="#66d9bd" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="41" y="185" fill="#66d9bd" transform="rotate(-90 41 185)" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700">8 ft average width</text>
  <text x="298" y="339" fill="#e8f3f0" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700">40 × 8 = 320 sq ft</text>
  <text x="613" y="52" fill="#e8f3f0" font-family="Arial, sans-serif" font-size="19" font-weight="700">2. Set finished depth</text>
  <text x="613" y="76" fill="#b9c8d2" font-family="Arial, sans-serif" font-size="13">Side view of the rock layer</text>
  <rect x="628" y="129" width="204" height="72" rx="3" fill="url(#pebbles)" stroke="#b7c5cf"/>
  <rect x="628" y="202" width="204" height="103" fill="#624d3e"/>
  <path d="M628 226q25-17 50 0t50 0 50 0 54 0M628 270q25-17 50 0t50 0 50 0 54 0" fill="none" stroke="#8d715e" stroke-width="2"/>
  <line x1="852" y1="129" x2="852" y2="201" stroke="#66d9bd" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="813" y="120" fill="#66d9bd" font-family="Arial, sans-serif" font-size="15" font-weight="700">3 in rock</text>
  <text x="730" y="258" fill="#ead6c0" text-anchor="middle" font-family="Arial, sans-serif" font-size="15">Existing soil</text>
  <text x="735" y="339" fill="#e8f3f0" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700">320 × 3 ÷ 324 = 2.96 yd³</text>
</svg>
