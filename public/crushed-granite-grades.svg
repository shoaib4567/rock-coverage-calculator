    <path d="M98 216v-20m0 0l-6 7m6-7l6 7" stroke="#78c8c4" stroke-width="3" fill="none"/>
    <text x="44" y="336" font-size="15" fill="#dce6e8">Open voids favor drainage</text>
    <text x="354" y="336" font-size="15" fill="#dce6e8">Fines fill gaps for a tighter surface</text>
    <text x="664" y="336" font-size="15" fill="#dce6e8">A different path material</text>
    <text x="44" y="360" font-size="13" fill="#a9bac3">Ask for size and gradation</text>
    <text x="354" y="360" font-size="13" fill="#a9bac3">Ask for the road or base specification</text>
    <text x="664" y="360" font-size="13" fill="#a9bac3">Check its own installation guidance</text>
  </g>
</svg>
