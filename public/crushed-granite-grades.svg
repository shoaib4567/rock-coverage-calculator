      <path d="M418 205l10-9 11 7-2 15-14 2z"/><path d="M494 232l12-11 13 9-3 15-13 1z"/><path d="M566 208l14 3 3 13-15 7-10-9z"/><path d="M375 212l10-3 10 10-6 13-13-1z"/>
      <path d="M679 160l10-7 11 8-2 12-14 2z"/><path d="M706 179l12-8 10 9-3 13-12 1z"/><path d="M738 158l9-6 13 7-1 12-13 3z"/><path d="M766 185l12-8 11 8-2 13-13 1z"/><path d="M799 161l11-7 11 8-2 14-14 1z"/><path d="M829 183l11-8 13 8-2 13-14 2z"/><path d="M864 158l10-6 13 8-3 12-12 3z"/><path d="M894 184l11-7 11 9-3 13-13 1z"/>
