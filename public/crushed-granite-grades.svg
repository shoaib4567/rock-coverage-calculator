<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420" role="img" aria-labelledby="title desc">
  <title id="title">Three granite grades shown in cross-section</title>
  <desc id="desc">Clean crushed granite has open voids around large angular pieces. A graded mix has smaller fragments and fines filling more voids. Decomposed granite is mostly small particles.</desc>
  <rect width="960" height="420" rx="22" fill="#111a24"/>
  <text x="30" y="42" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#f5ead2">What is in the granite load?</text>
  <g font-family="Arial,sans-serif">
    <rect x="24" y="68" width="292" height="312" rx="16" fill="#1b2a36" stroke="#466070"/>
    <rect x="334" y="68" width="292" height="312" rx="16" fill="#1b2a36" stroke="#466070"/>
    <rect x="644" y="68" width="292" height="312" rx="16" fill="#1b2a36" stroke="#466070"/>
    <text x="44" y="101" font-size="19" font-weight="700" fill="#f1d49a">Clean crushed stone</text>
    <text x="354" y="101" font-size="19" font-weight="700" fill="#f1d49a">Graded mix with fines</text>
    <text x="664" y="101" font-size="19" font-weight="700" fill="#f1d49a">Decomposed granite</text>
    <text x="44" y="123" font-size="14" fill="#bdcad1">Screened coarse pieces</text>
    <text x="354" y="123" font-size="14" fill="#bdcad1">Coarse and small particles</text>
    <text x="664" y="123" font-size="14" fill="#bdcad1">Predominantly fine particles</text>
    <rect x="42" y="145" width="256" height="159" rx="9" fill="#17232f" stroke="#344957"/>
    <rect x="352" y="145" width="256" height="159" rx="9" fill="#17232f" stroke="#344957"/>
    <rect x="662" y="145" width="256" height="159" rx="9" fill="#17232f" stroke="#344957"/>
    <g fill="#bca984" stroke="#e4d1aa" stroke-width="2">
      <path d="M56 248l22-25 35 5 11 26-19 26-35-2z"/><path d="M131 181l29-20 26 13 12 32-25 18-32-8z"/><path d="M207 240l35-20 30 14 12 30-24 22-40-7z"/><path d="M64 170l20-13 28 13-5 33-25 7-21-16z"/><path d="M128 263l26-27 34 9 11 31-24 16-35-5z"/><path d="M218 171l27-14 31 18-5 32-34 7-21-20z"/>
      <path d="M364 248l22-25 35 5 11 26-19 26-35-2z"/><path d="M439 181l29-20 26 13 12 32-25 18-32-8z"/><path d="M515 240l35-20 30 14 12 30-24 22-40-7z"/><path d="M372 170l20-13 28 13-5 33-25 7-21-16z"/><path d="M436 263l26-27 34 9 11 31-24 16-35-5z"/><path d="M526 171l27-14 31 18-5 32-34 7-21-20z"/>
