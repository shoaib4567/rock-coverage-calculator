<svg xmlns="http://www.w3.org/2000/svg" width="840" height="560" viewBox="0 0 840 560" role="img" aria-labelledby="title desc">
  <title id="title">One cubic yard of river rock spread three inches deep</title>
  <desc id="desc">A three-foot cube contains 27 cubic feet. Spread as a three-inch layer, that volume covers a twelve by nine foot bed, or 108 square feet.</desc>
  <defs>
    <linearGradient id="ground" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#e8e1d3"/><stop offset="1" stop-color="#d5cbbb"/></linearGradient>
    <linearGradient id="stone" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#c9ab83"/><stop offset="1" stop-color="#96765c"/></linearGradient>
    <pattern id="pebbles" width="46" height="36" patternUnits="userSpaceOnUse">
      <ellipse cx="10" cy="9" rx="9" ry="6" fill="#a78768"/><ellipse cx="32" cy="8" rx="12" ry="7" fill="#d2b58d"/><ellipse cx="22" cy="27" rx="12" ry="7" fill="#8c735f"/><ellipse cx="44" cy="29" rx="10" ry="6" fill="#b99b78"/>
    </pattern>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#386354" stroke-width="2"/></marker>
  </defs>
  <rect width="840" height="560" rx="20" fill="#f8f5ed"/>
  <text x="42" y="56" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#203b33">What one cubic yard becomes</text>
  <text x="42" y="88" font-family="Arial, sans-serif" font-size="15" fill="#52645c">The volume stays 27 cubic feet; the footprint changes with the finished depth.</text>

  <rect x="38" y="125" width="315" height="315" rx="16" fill="url(#ground)"/>
  <text x="58" y="158" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#203b33">Bulk volume</text>
  <polygon points="110,246 200,203 290,246 200,289" fill="#d6be9d" stroke="#765f4d" stroke-width="3"/>
  <polygon points="110,246 200,289 200,385 110,342" fill="url(#stone)" stroke="#765f4d" stroke-width="3"/>
  <polygon points="200,289 290,246 290,342 200,385" fill="#9c8168" stroke="#765f4d" stroke-width="3"/>
  <path d="M121 260l24 11m18 7 27 13m-67 4 21 10m23 10 24 12m-68 0 20 10m20 7 23 12m10-60 22-10m2 32 27-13m-42 50 26-13" stroke="#e6caa4" stroke-width="5" stroke-linecap="round" opacity=".8"/>
  <text x="83" y="425" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#203b33">3 ft × 3 ft × 3 ft = 27 ft³</text>

  <path d="M375 282 H444" stroke="#386354" stroke-width="4" marker-end="url(#arrow)"/>

  <rect x="471" y="125" width="331" height="315" rx="16" fill="url(#ground)"/>
  <text x="491" y="158" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#203b33">Spread as an even layer</text>
  <rect x="511" y="217" width="245" height="153" rx="6" fill="#846b55"/>
  <rect x="511" y="207" width="245" height="153" rx="6" fill="url(#pebbles)" stroke="#765f4d" stroke-width="3"/>
  <path d="M511 386 H756" stroke="#386354" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="609" y="408" font-family="Arial, sans-serif" font-size="15" fill="#203b33">12 ft</text>
  <path d="M491 207 V360" stroke="#386354" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="477" y="289" transform="rotate(-90 477 289)" font-family="Arial, sans-serif" font-size="15" fill="#203b33">9 ft</text>
  <text x="570" y="194" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#203b33">3 in finished depth</text>
  <text x="526" y="425" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#203b33">108 sq ft at 3 in deep</text>

  <rect x="38" y="467" width="764" height="59" rx="12" fill="#e7eee7"/>
  <text x="68" y="504" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#254b3e">27 ft³ ÷ 0.25 ft = 108 sq ft</text>
  <text x="573" y="502" font-family="Arial, sans-serif" font-size="13" fill="#52645c">Diagram is schematic.</text>
</svg>
